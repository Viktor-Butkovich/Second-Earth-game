name: second_earth
channel_priority: strict
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pydub
  - numpy
  - pyinstaller
  - pyautogui
  - scmrepo
  - pynput
  - opencv
  - black
  - pip
  - pip:
    - pygame
    - pedalboard

# Create environment with `mamba env create -f environment.yml`
# To add new dependencies, update the `environment.yml`, then update the environment with `mamba env update -f environment.yml --prune`
# Remove env with `conda env remove --name second_earth`, and clear cache with `conda clean -a`
